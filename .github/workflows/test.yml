# Builds the package and runs its tests on a fresh Mac for every push and
# pull request. Tests that need a model, the network, audio hardware or
# Apple's speech model skip there; see the README's Tests section.
# Signing, notarizing and releasing stay on the developer's Mac.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # mlx-swift compiles Metal shaders, and Xcode's Metal compiler is a
      # separate download that a fresh runner may not have.
      - name: Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      # No cache of .build: a saved build remembers where the Metal
      # compiler was mounted on the runner that made it, which differs on
      # every runner, and the next build fails. A clean build takes about
      # six minutes.
      - name: Test
        run: swift test
